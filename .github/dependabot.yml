# Keeps the Worker's dev toolchain (wrangler, vitest, typescript) patched.
# Every dependency here is a devDependency — none of it ships to the edge — but
# stale tooling is how lockfiles rot, so refresh it on a schedule.
#
# Note: Dependabot regenerates the lockfile with its own npm. If that npm writes
# a lockfile the Workers Builds npm cannot install, the Cloudflare Worker
# workflow turns red on the PR — regenerate the lockfile locally with the npm
# pinned in package.json's packageManager field before merging.
version: 2
updates:
  # The deployment shell customers clone. It depends on the published Worker
  # package, so these PRs are the same ones customers receive — we merge ours
  # first and find out about a bad release before they do. After publishing a
  # new version, trigger this from Insights → Dependency graph → Dependabot
  # rather than waiting up to a week.
  - package-ecosystem: npm
    directory: /cloudflare/ai-bot-collector
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "@trustdata/*"
      - dependency-name: "wrangler"
    groups:
      trustdata-worker:
        patterns: ["*"]

  # The Worker package's own dev toolchain (wrangler, vitest, typescript).
  - package-ecosystem: npm
    directory: /cloudflare/ai-bot-collector-src
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      worker-dev-dependencies:
        dependency-type: development

  # The pixel's only real dependency is the vendored ../core package, which
  # Dependabot cannot see; these are the Shopify CLI and extension tooling.
  - package-ecosystem: npm
    directory: /shopify/pixel
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      pixel-dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
